name: Liveness

# 서버 밖에서 하는 생존 감시.
#
# 왜: 서버가 죽거나 매시 주기가 멈추면 서버 안에서 나가는 로그·알림도 같이 멈춘다.
# 여기서 매시간 바깥에서 본다 — /health · /api/status 의 수집 침묵 시간 · 웹사이트 첫 화면.
# 판단 규칙은 epiweather-api/scripts/liveness_check.py(시험: tests/test_liveness_check.py).
#
# 알림(2026-11-22: 텔레그램 제거): 이상이면 스크립트가 종료 코드 1로 끝나 작업이 빨간불이 되고,
# GitHub 자체 알림이 저장소 소유자에게 간다. 별도 전송 채널은 없다.
#
# ★ 예약이 시간마다 오지 않는다 (2026-10-20 관측) ★ GitHub 예약 실행은 부하에 따라 늦거나 통째로
# 빠진다. 그래서 시간당 두 번 건다(빠지는 비율이 같아도 바깥에서 보는 간격이 줄어든다).

on:
  schedule:
    - cron: "25 * * * *"   # 매시 25분 — 정각 수집 주기(보통 :03 전후 끝) 뒤
    - cron: "55 * * * *"   # 매시 55분 — 25분 실행이 빠졌을 때의 두 번째 기회
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: liveness
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: epiweather-api/scripts

      - name: Check
        run: |
          python3 epiweather-api/scripts/liveness_check.py \
            --api https://epiweather-api-production.up.railway.app \
            --site https://epiweather-web.vercel.app/ko
