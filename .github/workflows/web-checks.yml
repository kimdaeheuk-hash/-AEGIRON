name: Web checks

on:
  push:
    paths:
      - "epiweather-web/**"
      - ".github/workflows/web-checks.yml"
  pull_request:
    paths:
      - "epiweather-web/**"
      - ".github/workflows/web-checks.yml"

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epiweather-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: epiweather-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
