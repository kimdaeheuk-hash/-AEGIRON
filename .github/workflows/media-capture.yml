name: Media capture

# 홈페이지용 실가동 화면·공공 사진 후보를 받아 같은 브랜치에 커밋한다.
# (.github/media-capture/capture.mjs 참고 — 개발 샌드박스는 외부 접속이 막혀 있어
#  러너에서 받는다.)
#
# 언제 도나:
#   · 수동 실행(Actions 탭의 Run workflow)
#   · claude/** 브랜치에서 수집 스크립트·워크플로를 바꿔 푸시할 때
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/media-capture/capture.mjs"
      - ".github/workflows/media-capture.yml"

permissions:
  contents: write

concurrency:
  group: media-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        working-directory: .github/media-capture
        run: |
          npm init -y > /dev/null
          npm install playwright@1.60.0 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Capture
        working-directory: .github/media-capture
        run: |
          rm -rf out
          node capture.mjs out

      - name: Commit results
        run: |
          git config user.name "aegiron-media-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/media-capture/out
          if git diff --cached --quiet; then
            echo "수집 결과에 변화 없음 — 커밋하지 않음"
          else
            git commit -m "미디어 후보 수집 결과 (자동)"
            git push origin HEAD:${{ github.ref_name }}
          fi
