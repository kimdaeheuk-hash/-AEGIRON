name: Backend tests

on:
  push:
    paths:
      - "epiweather-api/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "epiweather-api/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: epiweather-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run pytest
        # 갭 #11 — 커버리지 하한 75%. 2026-11-02 로컬 실측 78%(이 환경의
        # 소켓 차단으로 TestClient 계열 다수가 실패한 상태의 값)라 CI(Linux,
        # 소켓 정상)는 이보다 높게 나온다. 75는 큰 낙폭만 잡는 선이다 —
        # 올리려면 CI 실측 후.
        run: pytest tests/ -q --cov=algorithms --cov=db --cov=main --cov=collector --cov-report=term --cov-fail-under=75
