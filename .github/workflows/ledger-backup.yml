name: Ledger backup

# 원장·DB 의 하루 1회 외부 백업.
#
# 2026-11-22 개편: 예측 원장·BAIKAL 은 지웠다(복원 기준 커밋 83406e4). 남은 원장은
# 헤임달 변이 원장과 발할라 대조 원장이다.
#   · /api/variant-ledger          헤임달 변이 원장
#   · /api/valhalla/match-ledger   발할라 대조 원장
#   · /api/admin/db-backup         DB 전체(sqlite backup API 스냅숏, 시크릿 EPIWEATHER_API_KEY)
#
# 어디에: 워크플로 아티팩트(90일 보관). 브랜치에 커밋하지 않는다 — 커밋하면 Vercel 이
# 매일 미리보기 빌드를 돈다.
#
# 실패하면 빨간불: 응답을 못 받았거나, JSON 이 아니거나, DB 무결성 검사가 실패한 경우.
# 시크릿이 없으면 DB 백업만 경고로 건너뛴다.

on:
  schedule:
    - cron: "17 3 * * *"   # 매일 03:17 UTC (12:17 KST) — 매시 정각 수집 주기를 피함
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ledger-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API: https://epiweather-api-production.up.railway.app
    steps:
      - name: Fetch
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          mkdir -p "out/$day"
          echo "DAY=$day" >> "$GITHUB_ENV"
          fetch() {  # 이름 경로
            curl -sS --fail --retry 3 --retry-delay 20 -m 120 "$API$2" -o "out/$day/$1.json"
          }
          fetch variant_ledger  "/api/variant-ledger"
          fetch match_ledger    "/api/valhalla/match-ledger"

      - name: Fetch full DB
        env:
          KEY: ${{ secrets.EPIWEATHER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${KEY:-}" ]; then
            echo "::warning::EPIWEATHER_API_KEY 시크릿 없음 — DB 전체 백업 생략(원장 백업은 계속)"
            exit 0
          fi
          curl -sS --fail --retry 3 --retry-delay 20 -m 300 \
            -H "X-API-Key: $KEY" "$API/api/admin/db-backup" -o "out/$DAY/epiweather.db"

      - name: Verify
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sqlite3, sys
          d = pathlib.Path("out") / os.environ["DAY"]
          manifest, problems = {}, []
          for f in sorted(d.glob("*.json")):
              raw = f.read_bytes()
              try:
                  json.loads(raw)
              except ValueError:
                  problems.append(f"{f.name}: JSON 아님")
                  continue
              manifest[f.name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
          db_file = d / "epiweather.db"
          if db_file.exists():
              raw = db_file.read_bytes()
              manifest[db_file.name] = {"bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()}
              try:
                  conn = sqlite3.connect(db_file)
                  check = conn.execute("PRAGMA integrity_check").fetchone()[0]
                  conn.close()
              except sqlite3.Error as e:
                  check = f"열기 실패: {type(e).__name__}"
              manifest["_db"] = {"integrity": check}
              print(f"DB 전체 {len(raw):,}바이트 · 무결성 {check}")
              if check != "ok":
                  problems.append(f"DB 무결성 검사 실패: {check}")
          (d / "MANIFEST.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          if problems:
              print("백업 실패:", *problems, sep="\n  ")
              sys.exit(1)
          PY

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ledger-${{ env.DAY }}
          path: out/${{ env.DAY }}
          retention-days: 90
          if-no-files-found: error
